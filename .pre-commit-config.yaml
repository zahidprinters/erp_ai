exclude: 'node_modules|.git'
# Hooks run at commit time AND at push time: CI catches drift, but pre-commit
# catches it before it becomes a commit (cheaper and local). pre-push also
# catches the case where a commit was made with --no-verify.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]
fail_fast: false
minimum_pre_commit_version: "3.5.0"


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Repo-wide (not just `erp_ai.*`): docs and the CI workflow are part of
        # what we lint. Data/serialised files keep their exact bytes.
        exclude: '\.(json|txt|csv|svg|lock|md)$'
      - id: end-of-file-fixer
        exclude: '\.(json|txt|csv|svg|lock|md)$'
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to the same ruff release CI installs (see .github/workflows/ci.yml):
    # a stale hook rev silently disagreed with the lint config (UP045 was
    # unknown to 0.8.1, so the hook could not parse pyproject.toml at all).
    rev: v0.16.8
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                erp_ai/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                erp_ai/templates/includes/.*|
                erp_ai/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                erp_ai/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                erp_ai/templates/includes/.*|
                erp_ai/public/js/lib/.*
            )$

  # Commit-message hygiene: the repo's history is conventional-commit style
  # (feat/fix/ci/docs/chore/test/refactor/perf/build/style/revert), and a
  # machine-readable subject is what the CHANGELOG and release notes rely on.
  - repo: local
    hooks:
      - id: conventional-commit-subject
        name: "Commit message: <type>[(scope)]: subject"
        # `language: script` runs the file directly through its shebang
        # (#!/usr/bin/env python3): `entry: python …` broke on any box without a
        # bare `python` on PATH.
        entry: .github/scripts/check_commit_msg.py
        language: script
        stages: [commit-msg]
        always_run: true

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
