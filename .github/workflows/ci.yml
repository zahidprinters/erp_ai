name: erp_ai CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff is pinned to the same release as .pre-commit-config.yaml so the
          # local hook and CI can never disagree about the lint config.
          pip install pytest "ruff==0.16.8"

      - name: Ruff lint check (strict — fails on any violation)
        run: ruff check erp_ai/

      - name: Pre-commit hooks (what contributors run)
        # Same hooks as a local `pre-commit run --all-files`, so CI and the
        # hook can't disagree. The node-based hooks (prettier/eslint) need a
        # downloaded Node runtime and are enforced locally.
        run: |
          python -m pip install "pre-commit==4.6.2"
          SKIP=prettier,eslint pre-commit run --all-files --show-diff-on-failure

      - name: Syntax check (ast.parse every module)
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path("erp_ai").rglob("*.py"):
              if "__pycache__" in p.parts:
                  continue
              try:
                  ast.parse(p.read_text())
              except SyntaxError as e:
                  bad.append((str(p), str(e)))
          if bad:
              for p, e in bad:
                  print("SYNTAX:", p, e)
              sys.exit(1)
          print("All modules parse OK")
          EOF

      - name: No build artifacts or caches tracked in git
        run: |
          python - <<'EOF'
          import re, subprocess, sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          pattern = re.compile(
              r"(__pycache__|\.py[co]$|\.egg-info/|\.eggs/|\.pytest_cache/|\.ruff_cache/"
              r"|\.mypy_cache/|\.tox/|\.nox/|node_modules/|\.bak$|\.orig$|\.rej$|\.tmp$"
              r"|\.log$|\.sublime-|^\.cline/)"
          )
          bad = [p for p in tracked if pattern.search(p)]
          if bad:
              print("ARTIFACTS TRACKED IN GIT (audit point 13):")
              for path in bad:
                  print(" ", path)
              sys.exit(1)
          print("No artifacts tracked (%d files checked)" % len(tracked))
          EOF

      - name: Database-free tests
        run: |
          python -m pytest erp_ai/tests/test_core.py erp_ai/tests/test_security.py \
            erp_ai/tests/test_rbac.py erp_ai/tests/test_knowledge.py erp_ai/tests/test_infra.py \
            -q -p no:cacheprovider

  frappe-tests:
    # Real Frappe-backed tests: boots a bench, creates a site, installs erp_ai
    # (plus ERPNext so business DocTypes exist), and runs the suite.
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: 123
          MARIADB_DATABASE: test_site
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: erp_ai

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bench and Frappe
        run: |
          set -o pipefail
          {
            pip install frappe-bench --upgrade
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            bench init --skip-redis-config-generation --skip-assets \
              --frappe-branch version-15 frappe-bench
            cd frappe-bench
            # Get ERPNext first - it provides the business DocTypes that erp_ai depends on
            # ERPNext uses version tags (v15.x.x) not a version-15 branch
            bench get-app erpnext --branch v15.100.0 --skip-assets --resolve-deps
            # Verify erpnext was installed correctly using bench's Python
            # bench get-app installs to env/bin but we need to verify it works
            ./env/bin/python -c "import erpnext; print('erpnext version:', erpnext.__version__)"
            # Install the app under test from the local checkout. get-app is
            # the canonical path: it puts the app in the bench env (so
            # `import erp_ai` resolves) and registers it in sites/apps.txt.
            # The checkout must carry the branch bench clones by name.
            git -C "$GITHUB_WORKSPACE/erp_ai" checkout -B develop
            bench get-app erp_ai "$GITHUB_WORKSPACE/erp_ai" --skip-assets
            # bench init points redis at its own default ports (11000/13000/
            # 12000) which nothing listens on here; use the service container.
            bench set-config -g redis_cache redis://localhost:6379
            bench set-config -g redis_queue redis://localhost:6379
            bench set-config -g redis_socketio redis://localhost:6379
          } 2>&1 | tee /tmp/bench.log

      - name: Create site with ERPNext
        run: |
          cd frappe-bench
          set -o pipefail
          {
            bench new-site --mariadb-root-password 123 --admin-password admin \
              --install-app erpnext --set-default test_site
            bench --site test_site migrate
          } 2>&1 | tee /tmp/install.log

      - name: Install erp_ai on the site
        run: |
          cd frappe-bench
          set -o pipefail
          {
            # bench get-app clones the app into apps/ but does not register it in
            # the site's apps.txt. The "Create site" step installed erpnext via
            # --install-app, so apps.txt currently only lists frappe + erpnext.
            # Ensure erp_ai is registered before install-app runs, otherwise
            # bench raises "App erp_ai not in apps.txt".
            SITE_APPS="$(pwd)/sites/test_site/apps.txt"
            if ! grep -q '^erp_ai$' "$SITE_APPS"; then
              echo "erp_ai" >> "$SITE_APPS"
            fi
            bench --site test_site install-app erp_ai
          } 2>&1 | tee -a /tmp/install.log

      - name: Seed test masters (UOM, Customer Group, Company, Warehouses)
        # A fresh site lacks the setup-wizard masters (UOM "Nos", Customer
        # Group "Individual", default Company/warehouses/supplier) that the
        # test suite assumes. erp_ai.tests.ci_seed.seed is idempotent.
        run: |
          cd frappe-bench
          set -o pipefail
          {
            ./env/bin/python -m erp_ai.tests.ci_seed
          } 2>&1 | tee -a /tmp/seed.log

      - name: Report failure context (public annotation)
        # Logs need repo auth to read; annotations are public. Surface the tails
        # of both risky steps so a failure here is diagnosable without access.
        if: failure()
        run: |
          for f in /tmp/bench.log /tmp/install.log /tmp/seed.log; do
            if [ -f "$f" ]; then
              TAIL=$(tail -c 2500 "$f" | tr '\n' '~' | sed 's/%/%25/g')
              echo "::error title=$f tail::${TAIL}"
            else
              echo "::error title=$f::not produced"
            fi
          done

      - name: Run Frappe-backed app tests
        run: |
          cd frappe-bench
          ./env/bin/pip install pytest
          bench --site test_site run-tests --app erp_ai