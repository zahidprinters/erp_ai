[project]
name = "erp_ai"
authors = [
    { name = "SPI", email = "developer@spi.local"}
]
description = "Local AI assistant for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]
urls = {Homepage = "https://github.com/zahidprinters/erp_ai", Repository = "https://github.com/zahidprinters/erp_ai.git", Issues = "https://github.com/zahidprinters/erp_ai/issues"}

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    # --- style-modernization rules intentionally not gated ---
    # These would force a ~400-line no-behavior churn (printf->f-string,
    # typing.Dict->dict annotations) across the whole app; revisit when the
    # lint baseline is re-run with --unsafe-fixes on a feature branch.
    "UP006", # use `dict` instead of `Dict` in type annotations
    "UP010", # unnecessary futurology import
    "UP015", # redundant open modes
    "UP031", # printf-style string formatting
    "UP032", # use f-string
    "UP035", # deprecated typing imports
    "UP045", # non-pep604 optional annotation
    "RUF001", # ambiguous-unicode-character-string
    "RUF005", # collection-literal-concatenation
    "RUF010", # explicit f-string type conversion
    "RUF013", # implicit-optional
    "RUF059", # unused-unpacked-variable
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"erp_ai" = [
    "erp_ai/workspace/ai_assistant_hub/ai_assistant_hub.json",
]
